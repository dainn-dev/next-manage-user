<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAI-339 · ParkVision role prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#prototype-main">Bỏ qua điều hướng</a>
  <header class="review-bar">
    <div>
      <strong>DAI-339 prototype</strong>
      <span id="prototype-status" class="review-status">Chưa review</span>
    </div>
    <div class="review-actions">
      <button id="review-toggle" class="button button-secondary" type="button">Review</button>
      <button id="approve-prototype" class="button button-positive" type="button">Approve prototype</button>
    </div>
  </header>

  <div class="prototype-shell">
    <aside class="prototype-controls" aria-label="Điều khiển prototype">
      <h1>ParkVision</h1>
      <p class="eyebrow">Clickable critical paths</p>

      <label for="role-picker">Vai trò</label>
      <select id="role-picker">
        <option value="platform">Platform Admin</option>
        <option value="tenant">Tenant Admin</option>
        <option value="manager">Site Manager</option>
        <option value="guard">Security Guard</option>
        <option value="member">Member</option>
      </select>

      <label for="journey-picker">Critical path</label>
      <select id="journey-picker"></select>

      <fieldset>
        <legend>API state</legend>
        <div class="segmented" id="state-picker">
          <button type="button" data-state="success" aria-pressed="true">Success</button>
          <button type="button" data-state="pending" aria-pressed="false">Pending</button>
          <button type="button" data-state="failure" aria-pressed="false">Failure</button>
        </div>
      </fieldset>

      <nav aria-label="Các bước critical path">
        <ol id="step-list" class="step-list"></ol>
      </nav>

      <div class="prototype-note">
        <strong>Prototype only</strong>
        <span>Không gọi API và không thay đổi dữ liệu thật.</span>
      </div>
    </aside>

    <main id="prototype-main" class="app-frame" tabindex="-1">
      <header class="app-topbar">
        <button id="mobile-menu" class="icon-button" type="button" aria-label="Mở điều hướng">☰</button>
        <div>
          <p id="shell-label" class="eyebrow"></p>
          <h2 id="screen-title"></h2>
        </div>
        <div id="scope-chip" class="scope-chip"></div>
      </header>

      <div class="app-body">
        <nav id="app-navigation" class="app-navigation" aria-label="Điều hướng ứng dụng"></nav>
        <section class="screen-stage" aria-live="polite">
          <div id="screen-state" class="state-banner"></div>
          <div id="screen-content"></div>
          <footer class="screen-actions">
            <button id="back-step" class="button button-secondary" type="button">Quay lại</button>
            <button id="primary-action" class="button button-primary" type="button"></button>
          </footer>
        </section>
      </div>

      <nav id="member-bottom-nav" class="member-bottom-nav" aria-label="Điều hướng Member"></nav>
    </main>
  </div>

  <dialog id="review-dialog">
    <form method="dialog" class="review-form">
      <header>
        <div>
          <p class="eyebrow">Stakeholder review</p>
          <h2>Ghi nhận change request</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Đóng">×</button>
      </header>
      <label for="change-request">Yêu cầu thay đổi cụ thể</label>
      <textarea id="change-request" rows="4" placeholder="Ví dụ: Guard cần thấy timestamp snapshot ở bước xác minh…"></textarea>
      <div class="review-footer">
        <button class="button button-secondary" value="cancel">Hủy</button>
        <button id="save-change-request" class="button button-primary" value="default">Lưu change request</button>
      </div>
      <ul id="change-request-list" class="change-list"></ul>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
