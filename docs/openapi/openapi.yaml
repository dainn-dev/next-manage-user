openapi: 3.1.0
info:
  title: ParkVision Smart Parking Platform API
  version: 1.0.0-draft
  description: >-
    Target REST contract for the ParkVision multi-tenant Smart Parking SaaS. This is a design
    artifact (Status: Draft, 2026-07-09) for issue DAI-260, aligned with docs/14_Backend_API.

    Tenancy is implicit: user requests resolve the tenant from the JWT (`tid` claim), while
    camera ingest resolves tenant/site from X-Camera-Id plus X-Camera-Key; PostgreSQL Row-Level
    Security enforces both paths. Legacy endpoints
    under `/api` (auth, vehicles/check-vehicle, gates, vehicle-logs, access-requests) remain and
    are documented in code via springdoc; this spec focuses on the new `/api/v1` SaaS surface plus
    the edge ingest contract.
  contact:
    name: Principal Architect
servers:
  - url: https://{tenant}.parkvision.example.com/api/v1
    description: Production (per-tenant subdomain)
    variables:
      tenant:
        default: acme
  - url: http://localhost:8080/api/v1
    description: Local dev

tags:
  - name: Auth
  - name: Tenants
  - name: Sites
  - name: Cameras
  - name: Parking Slots
  - name: Vehicles
  - name: Events
  - name: Ingest
  - name: Billing
  - name: Notifications
  - name: Analytics
  - name: Chatbot

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive a JWT (carries tid/role/site scope)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current principal (user, tenant, role, site scope)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }

  /tenants:
    get:
      tags: [Tenants]
      summary: List tenants (PLATFORM_ADMIN only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenant' }
    post:
      tags: [Tenants]
      summary: Provision a tenant (PLATFORM_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }

  /sites:
    get:
      tags: [Sites]
      summary: List sites in the current tenant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Site' }
    post:
      tags: [Sites]
      summary: Create a site (TENANT_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }

  /sites/{siteId}/cameras:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Cameras]
      summary: List cameras/gates for a site (with derived online/offline)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Camera' }
    post:
      tags: [Cameras]
      summary: Enroll a camera (returns a per-camera ingest key)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CameraCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CameraWithKey' }

  /sites/{siteId}/parking-slots:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [Parking Slots]
      summary: List parking slots with live occupancy for a site
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParkingSlot' }
    put:
      tags: [Parking Slots]
      summary: Replace the site's slot map (from the Parking Map Designer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ParkingSlotUpsert' }
      responses:
        '200': { description: Updated }

  /vehicles:
    get:
      tags: [Vehicles]
      summary: Search vehicles in the tenant (by plate, status, site)
      parameters:
        - { name: plate, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehiclePage' }

  /vehicles/{vehicleId}/current-location:
    parameters:
      - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Vehicles]
      summary: Current slot, site, last-seen, and latest snapshot for a vehicle
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleLocation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /parking-events:
    get:
      tags: [Events]
      summary: Query the parking event log (timeline)
      parameters:
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParkingEvent' }
    post:
      tags: [Ingest]
      summary: Authenticated, idempotent camera event ingest
      description: >-
        The camera identity is authenticated by X-Camera-Id and X-Camera-Key. Tenant and site are
        derived server-side from that credential. Send JSON, or multipart with an event JSON part
        and one optional snapshot. Idempotency is scoped to (authenticated camera ID, event ID).
      security:
        - cameraId: []
          cameraKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/VehicleDetectedIngestEvent'
                - $ref: '#/components/schemas/PlateRecognizedIngestEvent'
                - $ref: '#/components/schemas/CameraIngestRequest'
          multipart/form-data:
            schema:
              type: object
              required: [event]
              properties:
                event: { $ref: '#/components/schemas/CameraIngestRequest' }
                snapshot:
                  type: string
                  format: binary
                  description: Optional single evidence image, maximum 5 MB.
            encoding:
              event:
                contentType: application/json
      responses:
        '202':
          description: Accepted or idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CameraIngestAccepted' }
        '400': { description: Malformed event or mismatched body camera ID }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Snapshot exceeds the configured 5 MB limit }

  /subscriptions/current:
    get:
      tags: [Billing]
      summary: Current tenant subscription, plan and entitlements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /billing/webhook:
    post:
      tags: [Billing]
      summary: Stripe webhook receiver (checkout, invoice.paid, subscription.updated)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Acknowledged }

  /notifications:
    get:
      tags: [Notifications]
      summary: List the current user's notifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /analytics/occupancy:
    get:
      tags: [Analytics]
      summary: Occupancy / fill-rate / dwell-time metrics for a site and range
      parameters:
        - { name: siteId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccupancyReport' }

  /chat:
    post:
      tags: [Chatbot]
      summary: Send a message to the AI assistant (tenant-scoped tool-calling)
      description: >-
        The LLM may call tenant-scoped tools getVehicleLocation/getHistory/getSnapshot/
        getParkingStatus. All tool calls run under the caller's tenant context; cross-tenant data
        is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cameraId:
      type: apiKey
      in: header
      name: X-Camera-Id
      description: Non-secret UUID of the camera that is presenting its ingest credential.
    cameraKey:
      type: apiKey
      in: header
      name: X-Camera-Key
      description: Per-camera ingest credential. Combined with X-Camera-Id, it derives tenant and site scope server-side.

  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing/invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found (or not visible under tenant scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        expiresIn: { type: integer }
        user: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: [string, 'null'], format: uuid }
        username: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [PLATFORM_ADMIN, TENANT_ADMIN, MEMBER]
        siteScope:
          type: array
          items: { type: string, format: uuid }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, trial] }
        planId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    TenantCreate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        planId: { type: [string, 'null'], format: uuid }
    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        timezone: { type: string }
        status: { type: string, enum: [active, inactive] }
    SiteCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        timezone: { type: string, default: Asia/Ho_Chi_Minh }
    Camera:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [ANPR_GATE, OVERVIEW] }
        panelType: { type: string, enum: [entry, exit] }
        status: { type: string, enum: [online, offline, disabled] }
        lastHeartbeatAt: { type: [string, 'null'], format: date-time }
    CameraCreate:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        rtspUrl: { type: string }
        role: { type: string, enum: [ANPR_GATE, OVERVIEW] }
        panelType: { type: string, enum: [entry, exit] }
    CameraWithKey:
      allOf:
        - $ref: '#/components/schemas/Camera'
        - type: object
          properties:
            ingestKey:
              type: string
              description: Shown once at creation; store securely on the edge appliance.
    ParkingSlot:
      type: object
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        zoneId: { type: [string, 'null'], format: uuid }
        code: { type: string, example: A01 }
        status: { type: string, enum: [free, occupied, reserved, disabled] }
        currentVehicleId: { type: [string, 'null'], format: uuid }
        polygon:
          type: array
          description: Image-space polygon [[x,y], ...]; stored server-side as PostGIS geometry.
          items:
            type: array
            items: { type: number }
    ParkingSlotUpsert:
      type: object
      required: [code, polygon]
      properties:
        code: { type: string }
        zoneId: { type: [string, 'null'], format: uuid }
        polygon:
          type: array
          items:
            type: array
            items: { type: number }
    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        licensePlate: { type: string }
        type: { type: string, enum: [car, motorbike, truck, bus] }
        currentSlotId: { type: [string, 'null'], format: uuid }
        currentSiteId: { type: [string, 'null'], format: uuid }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        snapshotUrl: { type: [string, 'null'] }
    VehiclePage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Vehicle' }
        totalElements: { type: integer }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
    VehicleLocation:
      type: object
      properties:
        vehicleId: { type: string, format: uuid }
        licensePlate: { type: string }
        siteId: { type: [string, 'null'], format: uuid }
        slotCode: { type: [string, 'null'] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
        snapshotUrl: { type: [string, 'null'] }
    EventType:
      type: string
      enum:
        - MotionDetected
        - VehicleDetected
        - PlateRecognized
        - VehicleEntered
        - VehicleRelocated
        - VehicleExited
        - PersonDetected
        - SnapshotSaved
        - NotificationSent
    ParkingEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        cameraId: { type: [string, 'null'], format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        licensePlate: { type: [string, 'null'] }
        trackId: { type: [string, 'null'] }
        slotId: { type: [string, 'null'], format: uuid }
        oldSlotId: { type: [string, 'null'], format: uuid }
        newSlotId: { type: [string, 'null'], format: uuid }
        personPresent: { type: [boolean, 'null'] }
        confidence: { type: [number, 'null'] }
        occurredAt: { type: string, format: date-time }
    CameraIngestRequest:
      type: object
      description: >-
        Current durable camera-ingest envelope. eventType is canonical; the runtime also accepts
        type as a legacy alias. cameraId is optional and, when supplied, must match X-Camera-Id.
        Tenant/site/object storage identity is derived by the backend and is never request input.
      required: [eventId, eventType, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
          description: Client-generated idempotency key, unique within the authenticated camera.
        eventType:
          type: string
          maxLength: 40
          description: Canonical event name; VehicleDetected and PlateRecognized have typed lpr-mvp-v1 profiles.
        cameraId:
          type: string
          format: uuid
          description: Optional echoed camera ID; cannot select or impersonate another camera.
        occurredAt:
          type: string
          format: date-time
          description: RFC 3339 detection time retained across offline retries.
        payload:
          type: object
          additionalProperties: true
          description: Generic structured event payload. Typed LPR profiles are additive conventions inside this field.
      additionalProperties: true

    VehicleDetectedIngestEvent:
      allOf:
        - $ref: '#/components/schemas/CameraIngestRequest'
        - type: object
          properties:
            eventType: { const: VehicleDetected }
            payload: { $ref: '#/components/schemas/VehicleDetectedPayload' }
          example:
            eventId: afc28cc1-7d60-4edb-a1d8-92881e00d8e4
            eventType: VehicleDetected
            cameraId: 6f5e50b3-b5a7-49b6-b341-bb16f1429100
            occurredAt: '2026-07-13T09:18:42.381+07:00'
            payload:
              eventVersion: 1
              pipeline: { id: lpr-mvp-v1, configurationHash: 'sha256:6e4b1d...' }
              frame: { capturedAt: '2026-07-13T09:18:42.381+07:00', width: 1920, height: 1080, coordinateSpace: original-frame-pixels }
              tracker: { sessionId: 8dc0d470-f897-4c15-abf9-03c7a8f0ac7f, trackId: '42' }
              vehicle:
                class: car
                confidence: 0.93
                boundingBox: { x: 492, y: 243, width: 916, height: 540 }
              models:
                vehicleDetector: { name: yolo11n, artifactVersion: '2026.07.0', confidenceThreshold: 0.4 }

    PlateRecognizedIngestEvent:
      allOf:
        - $ref: '#/components/schemas/CameraIngestRequest'
        - type: object
          properties:
            eventType: { const: PlateRecognized }
            payload: { $ref: '#/components/schemas/PlateRecognizedPayload' }
          example:
            eventId: 28e2e297-3285-45a3-89e5-94cc2e1fbbd3
            eventType: PlateRecognized
            cameraId: 6f5e50b3-b5a7-49b6-b341-bb16f1429100
            occurredAt: '2026-07-13T09:18:42.581+07:00'
            payload:
              eventVersion: 1
              causationEventId: afc28cc1-7d60-4edb-a1d8-92881e00d8e4
              pipeline: { id: lpr-mvp-v1, configurationHash: 'sha256:6e4b1d...' }
              frame: { capturedAt: '2026-07-13T09:18:42.581+07:00', width: 1920, height: 1080, coordinateSpace: original-frame-pixels }
              tracker: { sessionId: 8dc0d470-f897-4c15-abf9-03c7a8f0ac7f, trackId: '42' }
              vehicle:
                class: car
                confidence: 0.94
                boundingBox: { x: 492, y: 243, width: 916, height: 540 }
              plate:
                text: 51A-123.45
                normalizedText: 51A12345
                detectionConfidence: 0.94
                recognitionConfidence: 0.96
                boundingBox: { x: 780, y: 554, width: 242, height: 78 }
              snapshots:
                - { kind: original_frame, capturedAt: '2026-07-13T09:18:42.581+07:00', contentType: image/jpeg, width: 1920, height: 1080, sha256: 'sha256:0ad1...' }
                - { kind: plate_crop, contentType: image/jpeg, width: 242, height: 78, sha256: 'sha256:c62e...' }
              snapshotUpload: { part: snapshot, kind: plate_crop }
              models:
                vehicleDetector: { name: yolo11n, artifactVersion: '2026.07.0', confidenceThreshold: 0.4 }
                plateDetector: { name: lp-detector-nano, artifactVersion: '61', confidenceThreshold: 0.6 }
                ocr: { name: PaddleOCR, artifactVersion: pp-ocr-mobile, recognitionConfidenceThreshold: 0.8 }

    VehicleDetectedPayload:
      type: object
      required: [eventVersion, pipeline, frame, tracker, vehicle, models]
      properties:
        eventVersion: { const: 1 }
        pipeline: { $ref: '#/components/schemas/PipelineProvenance' }
        frame: { $ref: '#/components/schemas/FrameMetadata' }
        tracker: { $ref: '#/components/schemas/TrackerIdentity' }
        vehicle: { $ref: '#/components/schemas/VehicleDetection' }
        models:
          type: object
          required: [vehicleDetector]
          properties:
            vehicleDetector: { $ref: '#/components/schemas/ModelProvenance' }
        snapshots:
          type: array
          description: Descriptive evidence metadata; enter events may include the original frame.
          items: { $ref: '#/components/schemas/SnapshotMetadata' }
        snapshotUpload:
          type: object
          description: "When present on VehicleDetected, the optional multipart snapshot is the original frame."
          properties:
            part: { const: snapshot }
            kind: { type: string, enum: [original_frame, plate_crop] }

    PlateRecognizedPayload:
      allOf:
        - $ref: '#/components/schemas/VehicleDetectedPayload'
        - type: object
          required: [causationEventId, plate, models]
          properties:
            causationEventId: { type: string, format: uuid }
            plate: { $ref: '#/components/schemas/PlateRecognition' }
            snapshots:
              type: array
              description: Descriptive evidence metadata only; object keys and URLs are server-generated.
              items: { $ref: '#/components/schemas/SnapshotMetadata' }
            snapshotUpload:
              type: object
              description: "Current multipart convention: the one optional snapshot part is a plate crop."
              properties:
                part: { const: snapshot }
                kind: { const: plate_crop }
            models:
              type: object
              required: [vehicleDetector, plateDetector, ocr]
              properties:
                vehicleDetector: { $ref: '#/components/schemas/ModelProvenance' }
                plateDetector: { $ref: '#/components/schemas/ModelProvenance' }
                ocr: { $ref: '#/components/schemas/ModelProvenance' }

    PipelineProvenance:
      type: object
      required: [id, configurationHash]
      properties:
        id: { const: lpr-mvp-v1 }
        configurationHash: { type: string, pattern: '^sha256:' }
    FrameMetadata:
      type: object
      required: [capturedAt, width, height, coordinateSpace]
      properties:
        capturedAt: { type: string, format: date-time }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        coordinateSpace: { const: original-frame-pixels }
    TrackerIdentity:
      type: object
      required: [sessionId, trackId]
      properties:
        sessionId: { type: string, format: uuid }
        trackId: { type: string, minLength: 1 }
    BoundingBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    VehicleDetection:
      type: object
      required: [class, confidence, boundingBox]
      properties:
        class: { type: string, enum: [car, motorbike] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        boundingBox: { $ref: '#/components/schemas/BoundingBox' }
    PlateRecognition:
      type: object
      required: [text, normalizedText, detectionConfidence, recognitionConfidence, boundingBox]
      properties:
        text: { type: string, minLength: 1 }
        normalizedText: { type: string, pattern: '^[A-Z0-9]+$' }
        detectionConfidence: { type: number, minimum: 0, maximum: 1 }
        recognitionConfidence: { type: number, minimum: 0, maximum: 1 }
        boundingBox: { $ref: '#/components/schemas/BoundingBox' }
    ModelProvenance:
      type: object
      required: [name, artifactVersion]
      properties:
        name: { type: string }
        artifactVersion: { type: string }
        confidenceThreshold: { type: number, minimum: 0, maximum: 1 }
        recognitionConfidenceThreshold: { type: number, minimum: 0, maximum: 1 }
    SnapshotMetadata:
      type: object
      required: [kind, contentType, width, height, sha256]
      properties:
        kind: { type: string, enum: [original_frame, plate_crop] }
        capturedAt: { type: string, format: date-time }
        contentType: { type: string, pattern: '^image/' }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: '^sha256:' }
        sourceBoundingBox: { $ref: '#/components/schemas/BoundingBox' }
    CameraIngestAccepted:
      type: object
      required: [eventId, status]
      properties:
        eventId: { type: string, format: uuid }
        status: { const: accepted }
    Subscription:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        plan: { type: string, enum: [free, starter, pro, enterprise] }
        status: { type: string, enum: [trialing, active, past_due, canceled] }
        currentPeriodEnd: { type: string, format: date-time }
        entitlements:
          type: object
          properties:
            maxSites: { type: integer }
            maxCameras: { type: integer }
            retentionDays: { type: integer }
            chatbotMessagesPerMonth: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: VehicleRelocated }
        channel: { type: string, enum: [push, email, ws] }
        payload: { type: object, additionalProperties: true }
        readAt: { type: [string, 'null'], format: date-time }
        sentAt: { type: string, format: date-time }
    OccupancyReport:
      type: object
      properties:
        siteId: { type: string, format: uuid }
        totalSlots: { type: integer }
        occupied: { type: integer }
        free: { type: integer }
        fillRate: { type: number }
        avgDwellMinutes: { type: number }
        series:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              occupied: { type: integer }
    ChatRequest:
      type: object
      required: [message]
      properties:
        conversationId: { type: [string, 'null'], format: uuid }
        message: { type: string, example: "Xe tôi đang ở đâu?" }
    ChatResponse:
      type: object
      properties:
        conversationId: { type: string, format: uuid }
        answer: { type: string, example: "Xe 51A-12345 đang ở ô B12, ghi nhận 09:35." }
        toolCalls:
          type: array
          items:
            type: object
            properties:
              tool:
                type: string
                enum: [getVehicleLocation, getHistory, getSnapshot, getParkingStatus]
              arguments: { type: object, additionalProperties: true }
        attachments:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [snapshot] }
              url: { type: string }
