server:
  port: 8080

spring:
  application:
    name: vehicle-management-api
  main:
    allow-circular-references: true
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
      file-size-threshold: 2KB
      location: /app/temp
      resolve-lazily: false
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/vehicle_management}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  metrics:
    distribution:
      percentiles-histogram:
        camera.ingest.latency: true
  endpoints:
    web:
      exposure:
        # `prometheus` exposes /actuator/prometheus for scraping (Phase 4.1).
        # Restrict :8080/actuator/** at the network layer in production so only the
        # Prometheus server can reach it.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    console: "timestamp=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level service=vehicle-management-api correlation_id=%X{correlationId:-none} logger=%logger{36} message=%replace(%msg){'[\\r\\n]+',' '}%n"
  level:
    com.vehiclemanagement: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  admin-datasource:
    url: ${APP_ADMIN_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/vehicle_management}}
    # Compose local development shares the primary PostgreSQL login. Production
    # deployments must override both values with the dedicated admin login.
    username: ${APP_ADMIN_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${APP_ADMIN_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: platform-admin-pool
      maximum-pool-size: ${APP_ADMIN_DATASOURCE_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${APP_ADMIN_DATASOURCE_MINIMUM_IDLE:1}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400} # 24 hours in seconds

registration:
  rate-limit:
    enabled: ${REGISTRATION_RATE_LIMIT_ENABLED:true}
    capacity: ${REGISTRATION_RATE_LIMIT_CAPACITY:5}
    refill-period: ${REGISTRATION_RATE_LIMIT_REFILL_PERIOD:15m}
    bucket-expiry: ${REGISTRATION_RATE_LIMIT_BUCKET_EXPIRY:1h}
    maximum-tracked-ips: ${REGISTRATION_RATE_LIMIT_MAXIMUM_TRACKED_IPS:10000}
    trust-forwarded-headers: ${REGISTRATION_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
    trusted-proxies: ${REGISTRATION_RATE_LIMIT_TRUSTED_PROXIES:}

password-reset:
  token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
  rate-limit-window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:1h}
  email-limit: ${PASSWORD_RESET_EMAIL_LIMIT:3}
  ip-limit: ${PASSWORD_RESET_IP_LIMIT:10}
  fingerprint-secret: ${PASSWORD_RESET_FINGERPRINT_SECRET:}
  reset-url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}

email:
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:}
    endpoint: ${RESEND_ENDPOINT:https://api.resend.com/emails}
