services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: vehicle-management-db
    environment:
      POSTGRES_DB: vehicle_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vehicle-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: vehicle-management-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - vehicle-management-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Automatically create bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: vehicle-management-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin} ${OBJECT_STORAGE_SECRET_KEY:-minioadmin};
      mc mb myminio/${OBJECT_STORAGE_BUCKET:-vehicle-management-snapshots} --ignore-existing;
      mc anonymous set download myminio/${OBJECT_STORAGE_BUCKET:-vehicle-management-snapshots};
      echo 'MinIO bucket created and configured successfully';
      exit 0;
      "
    networks:
      - vehicle-management-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: vehicle-management-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      APP_ADMIN_DATASOURCE_USERNAME: ${APP_ADMIN_DATASOURCE_USERNAME:-postgres}
      APP_ADMIN_DATASOURCE_PASSWORD: ${APP_ADMIN_DATASOURCE_PASSWORD:-password}
      SPRING_PROFILES_ACTIVE: docker
      # JWT configuration (set JWT_SECRET in your .env or shell environment)
      JWT_SECRET: ${JWT_SECRET:-gNWqB5n2fJANVnwFwzEcB0X2skzlZruLmTsPXJohun0}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      PASSWORD_RESET_FINGERPRINT_SECRET: ${PASSWORD_RESET_FINGERPRINT_SECRET:?PASSWORD_RESET_FINGERPRINT_SECRET is required}
      # File upload configuration
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_ENABLED: true
      # Required X-Gate-Key header secret for public gate endpoints
      # (/api/vehicles/check-vehicle, POST /api/vehicle-logs). Empty = open (dev).
      GATE_API_KEY: ${GATE_API_KEY:-}
      GATE_ALLOW_OPEN: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Camera-ingest snapshots use server-side S3 PUTs to this local MinIO service.
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vehicle-management-snapshots}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_PATH_STYLE_ACCESS: "true"
    ports:
      - "8080:8080"  # Backend API port
    volumes:
      # Volume for temporary file storage (imports/exports)
      - file_storage:/app/temp
      # Volume for CSV templates and exports
      - csv_storage:/app/csv
    networks:
      - vehicle-management-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      platforms:
        - linux/amd64
    container_name: vehicle-management-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"  # Frontend port
    depends_on:
      - backend
    networks:
      - vehicle-management-network
    restart: unless-stopped

volumes:
  postgres_data:
  file_storage:
  csv_storage:
  minio_data:

networks:
  vehicle-management-network:
    driver: bridge
