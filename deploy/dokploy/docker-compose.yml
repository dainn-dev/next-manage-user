# Dokploy Docker Compose for Vehicle Management
#
# Deploy this whole stack from the git repo in Dokploy:
#   Project -> Service -> "Compose" -> Compose Type "Docker Compose"
#   -> source = your git repo, Compose Path = ./deploy/dokploy/docker-compose.yml
#
# Required env vars (set in the Dokploy Compose "Environment" tab):
#   VM_DOMAIN                      - public frontend domain, e.g. vm.example.com
#   API_DOMAIN                     - public backend domain, e.g. api.example.com
#   JWT_SECRET                     - long random string (openssl rand -base64 32)
#   PASSWORD_RESET_FINGERPRINT_SECRET - long random string (openssl rand -base64 32)
#   CORS_ALLOWED_ORIGINS           - must be https://<VM_DOMAIN>
#   NEXT_PUBLIC_API_URL            - must be https://<API_DOMAIN>
#
# Optional env vars:
#   POSTGRES_PASSWORD (default password), OBJECT_STORAGE_ACCESS_KEY /
#   OBJECT_STORAGE_SECRET_KEY (default minioadmin), GATE_API_KEY,
#   NEXT_PUBLIC_GATE_API_KEY, JWT_EXPIRATION (default 86400)
#
# NOTE: do NOT set container_name on services - Dokploy manages container
# names and a fixed name breaks logs/metrics/domains.

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin} ${OBJECT_STORAGE_SECRET_KEY:-minioadmin};
      mc mb myminio/${OBJECT_STORAGE_BUCKET:-vehicle-management-snapshots} --ignore-existing;
      mc anonymous set download myminio/${OBJECT_STORAGE_BUCKET:-vehicle-management-snapshots};
      echo 'MinIO bucket created and configured successfully';
      exit 0;
      "
    networks:
      - dokploy-network

  backend:
    build:
      # Build paths are resolved relative to this Compose file, which lives in
      # deploy/dokploy/. The backend Dockerfile expects backend/ as its context.
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      APP_ADMIN_DATASOURCE_USERNAME: postgres
      APP_ADMIN_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      PASSWORD_RESET_FINGERPRINT_SECRET: ${PASSWORD_RESET_FINGERPRINT_SECRET:-change-me}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_ENABLED: "true"
      GATE_API_KEY: ${GATE_API_KEY:-}
      GATE_ALLOW_OPEN: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${VM_DOMAIN:-vm.example.com}}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vehicle-management-snapshots}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_PATH_STYLE_ACCESS: "true"
    volumes:
      - file_storage:/app/temp
      - csv_storage:/app/csv
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vehicle-management-backend.rule=Host(`${API_DOMAIN:-api.example.com}`)"
      - "traefik.http.routers.vehicle-management-backend.entrypoints=websecure"
      - "traefik.http.routers.vehicle-management-backend.tls.certResolver=letsencrypt"
      - "traefik.http.services.vehicle-management-backend.loadbalancer.server.port=8080"

  frontend:
    build:
      # The frontend Dockerfile copies both frontend/ and the root tokens.css,
      # so its build context must be the repository root.
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com}
        NEXT_PUBLIC_GATE_API_KEY: ${NEXT_PUBLIC_GATE_API_KEY:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vehicle-management-frontend.rule=Host(`${VM_DOMAIN:-vm.example.com}`)"
      - "traefik.http.routers.vehicle-management-frontend.entrypoints=websecure"
      - "traefik.http.routers.vehicle-management-frontend.tls.certResolver=letsencrypt"
      - "traefik.http.services.vehicle-management-frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  file_storage:
  csv_storage:
  minio_data:

networks:
  dokploy-network:
    external: true
