name: vehicle-management-staging

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_DB: vehicle_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_management"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:?required}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes: [minio_data:/data]
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?required}:${RELEASE_VERSION:?required}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      APP_ADMIN_DATASOURCE_USERNAME: postgres
      APP_ADMIN_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?required}
      PASSWORD_RESET_FINGERPRINT_SECRET: ${PASSWORD_RESET_FINGERPRINT_SECRET:?required}
      GATE_API_KEY: ${GATE_API_KEY:?required}
      GATE_ALLOW_OPEN: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: vehicle-management-snapshots
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?required}
      OBJECT_STORAGE_PATH_STYLE_ACCESS: "true"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?required}:${RELEASE_VERSION:?required}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?required}
    ports: ["3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vehicle_management?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  postgres-backup:
    image: postgis/postgis:15-3.4-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    command: >-
      sh -c 'while true; do pg_dump -h postgres -U postgres -d vehicle_management -Fc
      -f /backups/vehicle-management-$$(date -u +%Y%m%dT%H%M%SZ).dump &&
      find /backups -type f -name "*.dump" -mtime +7 -delete; sleep 86400; done'
    volumes: [postgres_backups:/backups]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./secrets/prometheus-bearer-token:/run/secrets/prometheus_bearer_token:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    depends_on: [backend, postgres-exporter, alertmanager]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: [./alertmanager/alertmanager.generated.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  postgres_backups:
