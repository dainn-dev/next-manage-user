groups:
  - name: pilot-readiness
    rules:
      - alert: BackendUnavailable
        expr: up{job="backend"} == 0
        for: 30s
        labels: {severity: critical, owner: platform}
        annotations: {summary: "Staging backend is unavailable", runbook: "DAI-315/backend-unavailable"}
      - alert: CameraFleetOffline
        expr: gate_up == 0
        for: 5m
        labels: {severity: warning, owner: pilot-operations}
        annotations: {summary: "No camera gates report healthy", runbook: "DAI-315/camera-health"}
      - alert: IngestFailureRateHigh
        expr: sum(rate(http_server_requests_seconds_count{uri="/api/v1/parking-events",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{uri="/api/v1/parking-events"}[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: critical, owner: platform}
        annotations: {summary: "Camera ingest 5xx rate exceeds 1%", runbook: "DAI-315/ingest-failures"}
      - alert: EventOutboxLag
        expr: camera_ingest_outbox_pending > 100
        for: 5m
        labels: {severity: warning, owner: platform}
        annotations: {summary: "Camera event outbox is accumulating", runbook: "DAI-315/event-lag"}
      - alert: OcrFailureRateHigh
        expr: sum(rate(edge_ocr_attempts_total{outcome="failed"}[10m])) / clamp_min(sum(rate(edge_ocr_attempts_total[10m])), 0.001) > 0.10
        for: 10m
        labels: {severity: warning, owner: ai-operations}
        annotations: {summary: "OCR failure rate exceeds 10%", runbook: "DAI-315/ocr-failure"}
      - alert: OccupancyMismatch
        expr: sum(rate(parking_slot_observations_total{outcome=~"ambiguous|no_slot"}[10m])) > 0.1
        for: 10m
        labels: {severity: warning, owner: pilot-operations}
        annotations: {summary: "Slot mapping mismatch indicators are elevated", runbook: "DAI-315/occupancy-mismatch"}
      - alert: BillingWebhookFailures
        expr: increase(billing_webhook_requests_total{outcome="failed"}[10m]) > 2
        for: 1m
        labels: {severity: warning, owner: billing}
        annotations: {summary: "Billing webhook failures detected", runbook: "DAI-315/billing-webhooks"}
      - alert: DatabaseConnectionsSaturated
        expr: sum(pg_stat_activity_count) / scalar(max(pg_settings_max_connections)) > 0.80
        for: 5m
        labels: {severity: critical, owner: platform}
        annotations: {summary: "PostgreSQL connections exceed 80%", runbook: "DAI-315/database-capacity"}
      - alert: DatabaseUnavailable
        expr: up{job="postgres"} == 0
        for: 30s
        labels: {severity: critical, owner: platform}
        annotations: {summary: "PostgreSQL exporter cannot reach the database", runbook: "DAI-315/database-unavailable"}
      - alert: ObjectStorageUnavailable
        expr: up{job="minio"} == 0
        for: 30s
        labels: {severity: critical, owner: platform}
        annotations: {summary: "MinIO metrics endpoint is unavailable", runbook: "DAI-315/object-storage"}
      - alert: ObjectStorageCapacityLow
        expr: minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes < 0.15
        for: 10m
        labels: {severity: warning, owner: platform}
        annotations: {summary: "Object storage free capacity is below 15%", runbook: "DAI-315/object-storage-capacity"}
      - alert: WebSocketServerErrors
        expr: increase(http_server_requests_seconds_count{uri=~"/ws.*",status=~"5.."}[5m]) > 0
        for: 1m
        labels: {severity: warning, owner: platform}
        annotations: {summary: "WebSocket endpoint returns server errors", runbook: "DAI-315/websocket-health"}
