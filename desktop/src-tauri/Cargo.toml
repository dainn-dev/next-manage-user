[package]
name = "parking-site-agent"
version = "0.1.0"
description = "Parking Site Agent - Camera management desktop application"
authors = ["Vehicle Management"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "system-tray", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
dirs = "5.0"
md5 = "0.7"
whoami = "1.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }
