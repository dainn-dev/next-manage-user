# Docker Compose file for running from Docker Hub images
# This file uses the pre-built images from Docker Hub

services:
  postgres:
    image: postgres:15-alpine
    container_name: vehicle-management-db
    environment:
      POSTGRES_DB: vehicle_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vehicle-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: dainndev/vehicle-management-backend:latest
    container_name: vehicle-management-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vehicle_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_PROFILES_ACTIVE: docker
      # File upload configuration
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 50MB
      SPRING_SERVLET_MULTIPART_ENABLED: true
      # JWT configuration
      JWT_SECRET: mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm
      JWT_EXPIRATION: 86400
      # Required X-Gate-Key header secret for public gate endpoints
      # (/api/vehicles/check-vehicle, POST /api/vehicle-logs). Empty = open (dev).
      GATE_API_KEY: ${GATE_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      # Volume for temporary file storage (imports/exports)
      - file_storage:/app/temp
      # Volume for CSV templates and exports
      - csv_storage:/app/csv
    networks:
      - vehicle-management-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: dainndev/vehicle-management-frontend:latest
    container_name: vehicle-management-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://192.168.1.60:8080
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vehicle-management-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  file_storage:
    driver: local
  csv_storage:
    driver: local

networks:
  vehicle-management-network:
    driver: bridge
